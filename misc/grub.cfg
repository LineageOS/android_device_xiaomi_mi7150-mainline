initrd_no_align_up

set partition_misc="(hd0,gpt11)"

loopback boot /boot.img
loopback recovery /recovery.img
loopback vendor_boot /vendor_boot.img

# Note: Command `loadstring` is not available in upstream grub source code
loadstring $partition_misc android_misc 20 0
if [ "$android_misc" = "boot-recovery" ]; then
	# Boot to recovery
	set default=1
	set timeout=10
elif [ "$android_misc" = "bootonce-bootloader" ]; then
	# Do nothing
	true
else
	# Normal boot
	set default=0
	set timeout=10
fi

if insmod efi_gop; then
	terminal_output gfxterm
	loadfont /boot/grub/fonts/unicode.pf2
	insmod gfxmenu
fi

function boot_android {
	echo 'Loading parameters...'
	source (boot)/boot-info.cfg
	source (vendor_boot)/vendor_boot-info.cfg
	source (vendor_boot)/vendor_boot-ramdisk-fragment-info.cfg
	echo 'Loading kernel...'
	linux (boot)/kernel $android_boot_img_cmdline $android_vendor_boot_img_cmdline $@
	echo 'Loading ramdisk...'
	eval initrd (boot)/ramdisk.img ${android_vendor_boot_img_ramdisk_fragment_platform_list} ${android_vendor_boot_img_ramdisk_fragment_dlkm_list} (vendor_boot)/bootconfig.bin
}

function boot_android_recovery {
	echo 'Loading parameters...'
	source (recovery)/boot-info.cfg
	source (vendor_boot)/vendor_boot-info.cfg
	source (vendor_boot)/vendor_boot-ramdisk-fragment-info.cfg
	echo 'Loading kernel...'
	linux (recovery)/kernel $android_boot_img_cmdline $android_vendor_boot_img_cmdline $@
	echo 'Loading recovery ramdisk...'
	eval initrd (recovery)/ramdisk.img ${android_vendor_boot_img_ramdisk_fragment_platform_list} ${android_vendor_boot_img_ramdisk_fragment_recovery_list} ${android_vendor_boot_img_ramdisk_fragment_dlkm_list} (vendor_boot)/bootconfig.bin
}

menuentry "Android" {
	boot_android
}

menuentry "Android Recovery" {
	boot_android_recovery
}

menuentry "Android Charger" {
	boot_android androidboot.mode=charger
}

menuentry "Reboot" {
	reboot
}

menuentry "Exit" {
	exit
}
